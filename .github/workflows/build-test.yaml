name: Test

# racecar fork-testbed patch. Changes from upstream:
#   1. workflow_dispatch with a `leg` input, so racecar can trigger a run and
#      choose baseline vs instrumented. Upstream only fires on push/PR with a
#      paths filter, which racecar cannot drive.
#   2. actions/checkout -> crashappsec/action-checkout, which wraps checkout and
#      setup-chalk-action together (the internal pattern, cf. dummy-deployments).
#      `chalk:` is the single variable separating the two arms, and `profile:`
#      selects the observables profile.
#   3. permissions: id-token: write for the action's OIDC connect. Declaring the
#      block also zeroes every unlisted scope, so contents: read is restated.
#   4. A fail-closed assertion on the instrumented arm.
# Build and test COMMANDS are byte-identical to upstream.

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  pull_request:
    branches: "*"
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
  push:
    branches:
      - main
      - staging
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/**"

run-name: "Test ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms. On baseline, action-checkout skips
  # its Set up Chalk step entirely: no chalk, no curiosity, no LD_PRELOAD, no
  # residue to argue about.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.26

      - name: Checkout code
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          # Default is best-effort; a silently-uninstrumented run is a corrupt
          # data point rather than a degraded one, so fail closed.
          observables_continue_on_error: false
          # Upstream used actions/checkout, which does not fetch LFS. Keep the
          # tree identical to what upstream CI builds.
          lfs: false

      # Assert on the host-server socket, NOT on LD_PRELOAD: co-monitor's loader
      # clears LD_PRELOAD once it has injected so it does not cascade into every
      # child, which means an empty LD_PRELOAD is what SUCCESS looks like from
      # inside the shell. Process name is no good either -- co-hostd daemonizes
      # and pgrep does not match it. Socket existence is the signal curiosity's
      # own CI gates on.
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          echo "CURIOSITY_ROOT=${CURIOSITY_ROOT:-<unset>}"
          echo "CURIOSITY_SOCKET_NAME=${CURIOSITY_SOCKET_NAME:-<unset>}"
          command -v chalk >/dev/null && chalk version || echo "chalk not on PATH"
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent - build would run uninstrumented"; exit 1; }

      - name: Build Services
        run: make build/canopy-full

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.26

      - name: Checkout code
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false

      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      # Upstream caches the Go build. Left in place for this verification run; it
      # must be disabled before any timing comparison, or we would be measuring
      # cache-hit rate rather than instrumentation overhead.
      - name: Set up cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run Unit tests
        run: make build/canopy-full && go test $(go list ./... | grep -v cmd/auto-update)

name: Test

# racecar fork-testbed patch. Changes from upstream:
#   1. workflow_dispatch with a `leg` input, so racecar can trigger a run and
#      choose baseline vs instrumented. Upstream only fires on push/PR with a
#      paths filter, which racecar cannot drive.
#   2. permissions block: id-token: write is required by setup-chalk-action's
#      OIDC connect. NOTE this also zeroes every unlisted scope, so contents:
#      read is restated for actions/checkout.
#   3. The Set up Chalk step, which installs chalk, resolves the workspace
#      profile, and (when the profile enables build observables) installs
#      curiosity and exports LD_PRELOAD=co-monitor via $GITHUB_ENV. Everything
#      after it is instrumented with no edit to those steps.
#   4. A fail-closed assertion: the action defaults to best-effort, and an
#      uninstrumented run labelled "instrumented" is a corrupt data point rather
#      than a degraded one.
# Build and test steps themselves are byte-identical to upstream.

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  pull_request:
    branches: "*"
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
  push:
    branches:
      - main
      - staging
    paths:
      - "**.go"
      - "go.mod"
      - "go.sum"
      - ".github/workflows/**"

run-name: "Test ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

permissions:
  contents: read
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.26
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Chalk
        if: inputs.leg != 'baseline'
        uses: crashappsec/setup-chalk-action@main
        with:
          connect: true
          observables_continue_on_error: false
        env:
          CURIOSITY_STRICT: "1"
          REDBOX_BEACON_DISABLED: "1"

      # Assert on the host-server socket, NOT on LD_PRELOAD: co-monitor's loader
      # clears LD_PRELOAD once it has injected, so that it does not cascade into
      # every child process. An empty LD_PRELOAD is therefore what SUCCESS looks
      # like from inside the shell, and testing it gives a false negative on
      # every instrumented run.
      - name: Assert instrumentation is live
        if: inputs.leg != 'baseline'
        run: |
          echo "CURIOSITY_ROOT=${CURIOSITY_ROOT:-<unset>}"
          echo "CURIOSITY_SOCKET_NAME=${CURIOSITY_SOCKET_NAME:-<unset>}"
          command -v chalk >/dev/null && chalk version || echo "chalk not on PATH"
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent - build would run uninstrumented"; exit 1; }
          pgrep -a co-hostd || { echo "::error::co-hostd not running"; exit 1; }

      - name: Build Services
        run: make build/canopy-full

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: 1.26
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Chalk
        if: inputs.leg != 'baseline'
        uses: crashappsec/setup-chalk-action@main
        with:
          connect: true
          observables_continue_on_error: false
        env:
          CURIOSITY_STRICT: "1"
          REDBOX_BEACON_DISABLED: "1"

      - name: Assert instrumentation is live
        if: inputs.leg != 'baseline'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      # Upstream caches the Go build. Left in place for this first verification
      # run; it must be disabled before any timing comparison, or we would be
      # measuring cache-hit rate rather than instrumentation overhead.
      - name: Set up cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Run Unit tests
        run: make build/canopy-full && go test $(go list ./... | grep -v cmd/auto-update)
